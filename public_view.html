<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Dashboard — มุมมองสาธารณะ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg-0:#0a0d16;
  --bg-1:#131a2c;
  --panel:rgba(255,255,255,0.035);
  --border:rgba(255,255,255,0.10);
  --accent:#ffb020;
  --accent-2:#35e0a1;
  --text-dim:rgba(255,255,255,0.62);
  --text-dimmer:rgba(255,255,255,0.38);
}
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; font-family:'IBM Plex Sans Thai', sans-serif; color:#f2f3f5;
  background:linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%); background-attachment:fixed;
  position:relative;
}
body::after{
  content:""; position:fixed; inset:0;
  background:
    radial-gradient(760px 560px at 12% 8%, rgba(53,224,161,0.16), transparent 62%),
    radial-gradient(820px 620px at 88% 12%, rgba(255,176,32,0.14), transparent 62%),
    radial-gradient(900px 700px at 50% 105%, rgba(124,58,237,0.12), transparent 65%);
  pointer-events:none; z-index:0;
}
.hidden{ display:none !important; }
.container{ max-width:1500px; margin:auto; padding:40px; position:relative; z-index:2; }
.panel-surface{ background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)); border:1px solid var(--border); border-radius:16px; box-shadow:0 20px 50px rgba(0,0,0,0.55); }
.header{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:16px; flex-wrap:wrap; text-align:center; }
.brand-badge{ background:#fff; border-radius:9px; padding:5px 10px; display:inline-flex; align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(0,0,0,0.35); line-height:0; }
.brand-badge img{ height:26px; width:auto; display:block; }
.station-name{ font-size:22px; font-weight:700; background:var(--panel); border:1px solid var(--border); padding:10px 20px; border-radius:10px; }
.public-badge{ text-align:center; font-size:11px; opacity:0.55; margin-bottom:22px; font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.06em; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px; }
.card{
  background:linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.018));
  border:1px solid var(--border); border-radius:14px; padding:26px; min-height:200px;
  display:flex; flex-direction:column; justify-content:space-between; position:relative;
}
.card::before, .card::after{ content:""; position:absolute; width:14px; height:14px; border-color:var(--accent); border-style:solid; opacity:0.6; pointer-events:none; }
.card::before{ top:8px; left:8px; border-width:2px 0 0 2px; }
.card::after{ bottom:8px; right:8px; border-width:0 2px 2px 0; }
.card-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.card-icon{ font-size:22px; }
.card-label{ font-size:12px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; opacity:0.7; }
.big{ font-family:'IBM Plex Mono',monospace; font-size:44px; font-weight:600; line-height:1; letter-spacing:-0.01em; font-variant-numeric:tabular-nums; }
.big .unit{ font-size:18px; font-weight:400; opacity:0.55; margin-left:6px; }
.gauge-track{ position:relative; width:100%; height:22px; border-radius:5px; overflow:hidden; background:rgba(255,255,255,0.05);
  background-image:repeating-linear-gradient(90deg, rgba(0,0,0,0.4) 0 1px, transparent 1px 5%); margin-top:12px; border:1px solid var(--border); }
.gauge-fill{ height:100%; background:repeating-linear-gradient(135deg, var(--accent-2) 0 8px, #17805c 8px 16px); transition:width 0.6s ease; }
.status-row{ display:flex; align-items:center; gap:10px; }
.led-dot{ width:13px; height:13px; border-radius:50%; background:rgba(255,255,255,0.18); flex-shrink:0; }
.led-dot.on{ background:var(--accent-2); box-shadow:0 0 10px 3px rgba(53,224,161,0.65); }
.status-text{ font-family:'IBM Plex Mono',monospace; font-weight:600; letter-spacing:0.06em; font-size:20px; text-transform:uppercase; }
.chart-trigger{ position:absolute; bottom:12px; right:12px; width:34px; height:34px; border-radius:8px; background:var(--panel); border:1px solid var(--border); color:white; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.chart-trigger:hover{ background:rgba(255,255,255,0.08); }
.datetime-card #dateDisplay{ font-size:13px; opacity:0.6; font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.04em; }
.datetime-card #timeDisplay{ font-family:'IBM Plex Mono',monospace; font-size:42px; font-weight:600; margin-top:6px; }
.overlay{ position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(3,5,8,0.7); z-index:30; display:none; align-items:center; justify-content:center; padding:20px; }
.overlay.open{ display:flex; }
.panel{ background:#0d1319; border:1px solid var(--border); border-radius:18px; padding:24px 28px; width:640px; max-width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.6); }
.chart-canvas-wrap{ position:relative; height:280px; }
.chart-loading-text{ font-size:12px; opacity:0.55; margin-top:8px; text-align:center; font-family:'IBM Plex Mono',monospace; }
.icon-btn{ width:36px; height:36px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:white; font-size:15px; cursor:pointer; }
.credit{ position:fixed; bottom:16px; right:24px; z-index:3; background:var(--panel); border:1px solid var(--border); padding:8px 18px; border-radius:20px; font-size:11px; opacity:0.7; font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.04em; }
.center-msg{ text-align:center; padding:80px 20px; }
.center-msg .emoji{ font-size:44px; margin-bottom:14px; opacity:0.7; }
</style>
</head>
<body>

<div class="container">
  <div id="loadingMsg" class="center-msg">
    <div class="emoji">🛰️</div>
    <div class="mono" style="font-family:'IBM Plex Mono',monospace; font-size:13px; opacity:0.6; text-transform:uppercase; letter-spacing:0.06em;">กำลังโหลดแดชบอร์ด...</div>
  </div>

  <div id="notFoundMsg" class="center-msg panel-surface hidden">
    <div class="emoji">🔒</div>
    <div style="font-size:17px; font-weight:700; margin-bottom:6px;">ไม่พบแดชบอร์ดนี้</div>
    <div style="opacity:0.55; font-size:13px;">ลิงก์นี้อาจไม่ถูกต้อง หรือเจ้าของปิดการแชร์แบบสาธารณะไปแล้ว</div>
  </div>

  <div id="content" class="hidden">
    <div class="header">
      <div class="brand-badge"><img src="CRC_Faculty-of-Engineering_Logo.png" alt="โลโก้"></div>
      <div class="station-name" id="stationTitle">แดชบอร์ด</div>
    </div>
    <div class="public-badge">👁️ มุมมองสาธารณะ (อ่านอย่างเดียว) — ข้อมูลเรียลไทม์จากเจ้าของแดชบอร์ด</div>
    <div class="grid" id="fieldsGrid"></div>
  </div>
</div>

<div class="overlay" id="chartOverlay">
  <div class="panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h3 id="chartTitle" style="margin:0; font-size:18px;">กราฟย้อนหลัง</h3>
      <button class="icon-btn" id="btnCloseChart">✕</button>
    </div>
    <div class="chart-canvas-wrap"><canvas id="historyChartCanvas"></canvas></div>
    <div class="chart-loading-text" id="chartLoadingText">กำลังโหลดข้อมูล...</div>
  </div>
</div>

<div class="credit">IoT Dashboard · Supabase + ThingSpeak</div>

<script>
const SUPABASE_URL = "https://euhbpcwzwljwvrhkvvqi.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_KCsq29eQ4Ijx3h_QN3WVjA_z4pQewQ5";

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function main(){
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("u");
  const loadingMsg = document.getElementById("loadingMsg");
  const notFoundMsg = document.getElementById("notFoundMsg");
  const content = document.getElementById("content");

  if(!slug || SUPABASE_URL.startsWith("YOUR_")){
    loadingMsg.classList.add("hidden");
    notFoundMsg.classList.remove("hidden");
    return;
  }

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data, error } = await sb.from("dashboards").select("*").eq("share_slug", slug).eq("is_public", true).maybeSingle();

  if(error || !data){
    loadingMsg.classList.add("hidden");
    notFoundMsg.classList.remove("hidden");
    return;
  }

  loadingMsg.classList.add("hidden");
  content.classList.remove("hidden");

  const dashboard = data;
  document.getElementById("stationTitle").innerText = dashboard.station_name || "แดชบอร์ด";
  if(dashboard.background_url){
    document.body.style.background = `url('${dashboard.background_url}') no-repeat center center fixed`;
    document.body.style.backgroundSize = "cover";
  }

  function clockHTML(){
    return `<div class="card">
      <div class="card-head"><span class="card-icon">🕒</span><span class="card-label">วันที่ &amp; เวลา</span></div>
      <div><div id="dateDisplay" class="datetime-card"></div><div id="timeDisplay" style="font-family:'IBM Plex Mono',monospace; font-size:42px; font-weight:600; margin-top:6px;"></div></div>
    </div>`;
  }
  function updateClock(){
    const now = new Date();
    const d = document.getElementById("dateDisplay");
    const t = document.getElementById("timeDisplay");
    if(d) d.innerText = now.toLocaleDateString("th-TH",{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    if(t) t.innerText = now.toLocaleTimeString("th-TH",{hour:'2-digit',minute:'2-digit'});
  }
  setInterval(updateClock, 1000);

  function fieldCardHTML(f){
    if(f.type === "status"){
      return `<div class="card" data-field-id="${f.id}">
        <div class="card-head"><span class="card-icon">${f.icon||"⚙️"}</span><span class="card-label">${escapeHtml(f.label)}</span></div>
        <div class="status-row"><span class="led-dot" id="led-${f.id}"></span><span class="status-text" id="val-${f.id}">--</span></div>
        <button class="chart-trigger" data-chart-for="${f.id}">📈</button>
      </div>`;
    }
    if(f.type === "gauge"){
      return `<div class="card" data-field-id="${f.id}">
        <div class="card-head"><span class="card-icon">${f.icon||"📊"}</span><span class="card-label">${escapeHtml(f.label)}</span></div>
        <div><div class="big" id="val-${f.id}">-- <span class="unit">${escapeHtml(f.unit||"")}</span></div>
        <div class="gauge-track"><div class="gauge-fill" id="bar-${f.id}" style="width:0%"></div></div></div>
        <button class="chart-trigger" data-chart-for="${f.id}">📈</button>
      </div>`;
    }
    return `<div class="card" data-field-id="${f.id}">
      <div class="card-head"><span class="card-icon">${f.icon||"📟"}</span><span class="card-label">${escapeHtml(f.label)}</span></div>
      <div class="big" id="val-${f.id}">-- <span class="unit">${escapeHtml(f.unit||"")}</span></div>
      <button class="chart-trigger" data-chart-for="${f.id}">📈</button>
    </div>`;
  }

  const fieldsGrid = document.getElementById("fieldsGrid");
  function renderGrid(){
    const fields = (dashboard.fields || []).filter(f => f.enabled);
    let html = clockHTML();
    if(fields.length === 0){
      html += `<div class="panel-surface" style="grid-column:1/-1; text-align:center; padding:50px 20px;">เจ้าของแดชบอร์ดนี้ยังไม่ได้เพิ่มการ์ดข้อมูล</div>`;
    } else {
      html += fields.map(fieldCardHTML).join("");
    }
    fieldsGrid.innerHTML = html;
    updateClock();
    fieldsGrid.querySelectorAll("[data-chart-for]").forEach(btn => {
      btn.addEventListener("click", () => openHistoryChart(btn.getAttribute("data-chart-for")));
    });
  }
  renderGrid();

  function renderFieldValue(f, value){
    const valEl = document.getElementById("val-" + f.id);
    if(!valEl) return;
    if(f.type === "status"){
      const isOn = value !== null && value >= 1;
      const ledEl = document.getElementById("led-" + f.id);
      valEl.innerText = value === null ? "--" : (isOn ? "ทำงาน (ON)" : "ปิด (OFF)");
      valEl.style.color = isOn ? "var(--accent-2)" : "var(--text-dimmer)";
      if(ledEl) ledEl.classList.toggle("on", isOn);
      return;
    }
    const unitSpan = valEl.querySelector(".unit");
    const unitHtml = unitSpan ? unitSpan.outerHTML : `<span class="unit">${escapeHtml(f.unit||"")}</span>`;
    if(value === null || isNaN(value)){
      valEl.innerHTML = "-- " + unitHtml;
    } else {
      const shown = Number.isInteger(value) ? value : value.toFixed(1);
      valEl.innerHTML = shown + " " + unitHtml;
    }
    if(f.type === "gauge"){
      const barEl = document.getElementById("bar-" + f.id);
      const min = Number(f.min ?? 0), max = Number(f.max ?? 100);
      let pct = value === null || isNaN(value) ? 0 : ((value - min) / (max - min)) * 100;
      pct = Math.max(0, Math.min(100, pct));
      if(barEl) barEl.style.width = pct + "%";
    }
  }

  async function fetchLiveData(){
    const channel = dashboard.thingspeak_channel;
    const readKey = dashboard.thingspeak_read_key;
    if(!channel || !readKey) return;
    try{
      const res = await fetch(`https://api.thingspeak.com/channels/${channel}/feeds/last.json?api_key=${readKey}`);
      const data2 = await res.json();
      (dashboard.fields || []).filter(f => f.enabled).forEach(f => {
        const raw = data2[f.tsField];
        const value = raw === null || raw === undefined || raw === "" ? null : parseFloat(raw);
        renderFieldValue(f, value);
      });
    } catch(err){ console.error(err); }
  }
  fetchLiveData();
  setInterval(fetchLiveData, 16000);

  let historyChart = null;
  const chartOverlay = document.getElementById("chartOverlay");
  document.getElementById("btnCloseChart").addEventListener("click", () => chartOverlay.classList.remove("open"));
  chartOverlay.addEventListener("click", (e) => { if(e.target === chartOverlay) chartOverlay.classList.remove("open"); });

  async function openHistoryChart(fieldId){
    const f = (dashboard.fields || []).find(x => x.id === fieldId);
    if(!f) return;
    chartOverlay.classList.add("open");
    const loadingText = document.getElementById("chartLoadingText");
    loadingText.style.display = "block";
    loadingText.innerText = "กำลังโหลดข้อมูล...";
    document.getElementById("chartTitle").innerText = `${f.icon||""} ${f.label} ย้อนหลัง 24 ชม.`;
    try{
      const res = await fetch(`https://api.thingspeak.com/channels/${dashboard.thingspeak_channel}/feeds.json?api_key=${dashboard.thingspeak_read_key}&days=1`);
      const data2 = await res.json();
      const feeds = data2.feeds || [];
      const labels = feeds.map(x => new Date(x.created_at).toLocaleTimeString("th-TH",{hour:'2-digit',minute:'2-digit'}));
      const values = feeds.map(x => x[f.tsField] !== null && x[f.tsField] !== undefined ? parseFloat(x[f.tsField]) : null);
      if(historyChart) historyChart.destroy();
      const ctx = document.getElementById("historyChartCanvas").getContext("2d");
      historyChart = new Chart(ctx, {
        type: "line",
        data: { labels, datasets: [{ label: `${f.label} (${f.unit||""})`, data: values,
          borderColor: "#ffb020", backgroundColor: "rgba(255,176,32,0.12)", tension: 0.3, pointRadius: 0, borderWidth: 2.5, fill: true }]},
        options: { responsive:true, maintainAspectRatio:false, interaction:{mode:"index", intersect:false},
          plugins:{ legend:{ labels:{ color:"#fff", font:{family:"IBM Plex Mono"} } } },
          scales:{ x:{ ticks:{ color:"#aab", maxTicksLimit:6, font:{family:"IBM Plex Mono"} }, grid:{ color:"rgba(255,255,255,0.06)" } },
                    y:{ ticks:{ color:"#aab", font:{family:"IBM Plex Mono"} }, grid:{ color:"rgba(255,255,255,0.06)" } } } }
      });
      loadingText.style.display = "none";
    } catch(err){
      loadingText.innerText = "โหลดข้อมูลกราฟไม่สำเร็จ";
      console.error(err);
    }
  }
}
main();
</script>
</body>
</html>
