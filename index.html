<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>เว็บไซต์ได้ย้ายแล้ว</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(135deg, #123b5d, #168f98);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            text-align: center;

            background: rgba(255, 255, 255, 0.96);
            border-radius: 24px;
            padding: 60px 40px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e8f7f7;
            border-radius: 50%;

            font-size: 42px;
        }

        h1 {
            color: #163b5c;
            font-size: 32px;
            margin-bottom: 18px;
        }

        p {
            color: #64748b;
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 10px;
        }

        .new-site {
            display: inline-block;
            margin: 20px 0 30px;

            color: #168f98;
            font-size: 24px;
            font-weight: 700;
        }

        .btn {
            display: inline-block;

            padding: 16px 35px;

            background: linear-gradient(135deg, #123b5d, #168f98);
            color: white;

            text-decoration: none;
            font-size: 18px;
            font-weight: 600;

            border-radius: 12px;

            box-shadow: 0 10px 25px rgba(22, 143, 152, 0.25);

            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(22, 143, 152, 0.35);
        }

        .footer {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;

            color: #94a3b8;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            .container {
                padding: 45px 25px;
            }

            h1 {
                font-size: 27px;
            }

            p {
                font-size: 16px;
            }

            .new-site {
                font-size: 20px;
            }

            .btn {
                width: 100%;
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">
            😀
        </div>

        <h1>เว็บไซต์ได้ย้ายไปยังเว็บไซต์ใหม่</h1>

        <p>
            ขณะนี้เว็บไซต์ได้ย้ายไปยัง
        </p>

        <div class="new-site">
            www.crciot.com
        </div>

        <br>

        <a href="https://crciot.com/crcsta.1.html" class="btn">
            ไปยังหน้าเว็บไซต์ใหม่ →
        </a>

        <div class="footer">
            © 2026 Faculty of Engineering, Chiangrai College.
            All Rights Reserved.
        </div>

    </div>

</body>
</html>
